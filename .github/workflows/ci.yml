name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --frozen
      - name: Compile
        run: uv run python -m compileall -q src
